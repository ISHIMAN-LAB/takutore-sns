name: SNS Auto Post

on:
  schedule:
    # 月・水・金 10:30 UTC = 19:30 JST
    - cron: "30 10 * * 1,3,5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "ドライラン(投稿せずログのみ)"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # state.json を commit back するため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run poster
        env:
          # X (未セットアップなので ENABLE_X=false が前提)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Facebook Page
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          # Instagram Business
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ secrets.IMAGE_BASE_URL }}
          # プラットフォーム ON/OFF (Repo Variables で上書き可)
          ENABLE_X: ${{ vars.ENABLE_X || 'false' }}
          ENABLE_FB: ${{ vars.ENABLE_FB || 'true' }}
          ENABLE_IG: ${{ vars.ENABLE_IG || 'true' }}
          # DRY_RUN: 安全側にデフォルト true. 本番稼働時は repo var で DRY_RUN=false に
          DRY_RUN: ${{ inputs.dry_run || vars.DRY_RUN || 'true' }}
        run: python poster.py

      - name: Commit state.json
        if: ${{ !inputs.dry_run && vars.DRY_RUN != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "Update state $(date -u +%Y-%m-%d)"
          git push
